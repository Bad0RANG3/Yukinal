name: "缺陷报告"
description: "报告可复现的行为错误；安全漏洞请使用私密报告渠道。"
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: "提交前检查"
      options:
        - label: "我已搜索现有 Issue，并阅读 docs/limitations.md 中的已知限制。"
          required: true
        - label: "这不是需要私下报告的安全漏洞。"
          required: true
  - type: input
    id: version
    attributes:
      label: "Yukinal 版本"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: "操作系统"
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "影响区域"
      options:
        - Agent / Provider
        - SSH / 服务器
        - 终端
        - 远程文件
        - MCP
        - 权限与审批
        - 安装或打包
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "问题描述"
      description: "实际发生了什么？为什么这是错误？"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "复现步骤"
      description: "给出最小、稳定、可执行的步骤。"
      placeholder: "1. 打开...\n2. 点击...\n3. 观察到..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "预期结果"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "脱敏日志或截图"
      description: "不要粘贴真实凭据、令牌、私钥或完整主机信息。"
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "补充信息"
      description: "网络环境、Provider 类型、是否可稳定复现等。"
    validations:
      required: false