name: "功能建议"
description: "提出与现有边界兼容的用户价值或开发体验改进。"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: "提交前检查"
      options:
        - label: "我已搜索现有 Issue 和 docs/README.md，确认这不是已有能力或明确不做的边界。"
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题"
      description: "描述用户场景、当前代价和为什么现有能力不足。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案"
      description: "说明期望行为、界面入口和错误/取消路径。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      description: "列出考虑过的替代方案及取舍。"
    validations:
      required: false
  - type: textarea
    id: boundary
    attributes:
      label: "边界影响"
      description: "是否触碰权限模型、IPC、sidecar 协议、Provider、MCP、凭据或平台打包？如是，请说明。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "可验证的验收条件"
      description: "未来如何用一个测试、命令或可复现流程证明它完成？"
    validations:
      required: true