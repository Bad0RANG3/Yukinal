name: release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} portable payload
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            openssh_container_test: ON
          - os: windows-latest
            openssh_container_test: OFF
          - os: macos-latest
            openssh_container_test: OFF
    env:
      YUKINAL_SSH_CMAKE_BUILD_DIR: native/build-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            agent/pyproject.toml
            services/control-plane/pyproject.toml

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libsecret-1-dev build-essential curl wget file libssl-dev

      - name: Install Python build and test dependencies
        run: python -m pip install -e "agent[agent,models,test,package]"

      - name: Install control-plane test dependencies
        run: python -m pip install -e "services/control-plane[test]"

      - name: Add NMake to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio C++ tools were not found.' }
          $nmake = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\nmake.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $nmake) { throw 'NMake was not found in the selected Visual Studio installation.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $nmake)

      - name: Configure native host and service
        run: cmake -S native -B native/build-release -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYUKINAL_FETCH_DEPS=ON -DYUKINAL_BUILD_TESTS=ON -DYUKINAL_ENABLE_SSH_CONTAINER_TEST=${{ matrix.openssh_container_test }}

      - name: Build native targets
        if: matrix.os != 'windows-latest'
        run: cmake --build native/build-release --config Release --parallel

      - name: Build native targets (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLDIR=%%i"
          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build native/build-release --config Release

      - run: pnpm install --frozen-lockfile

      - name: Run full project gate
        run: pnpm check
        env:
          YUKINAL_CONTROL_PLANE_REQUIRED: "1"

      - name: Build frozen Python Agent
        run: pnpm build:python-agent

      - name: Resolve built native executables
        id: resolve
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $hostExe = @(
            "native/build-release/Release/yukinal-desktop-host$suffix",
            "native/build-release/yukinal-desktop-host$suffix"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $sshService = @(
            "native/build-release/Release/yukinal-ssh-service$suffix",
            "native/build-release/yukinal-ssh-service$suffix"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $hostExe) { throw 'The native desktop host executable is missing.' }
          if (-not $sshService) { throw 'The native SSH service executable is missing.' }
          "host_exe=$($hostExe.Replace('\', '/'))" >> $env:GITHUB_OUTPUT
          "ssh_service=$($sshService.Replace('\', '/'))" >> $env:GITHUB_OUTPUT

      - name: Stage release payload
        run: >-
          node scripts/package.mjs --out target/release/bundle
          --host-exe "${{ steps.resolve.outputs.host_exe }}"
          --ssh-service-exe "${{ steps.resolve.outputs.ssh_service }}"

      - name: Verify release payload
        run: node scripts/package.mjs --verify --out target/release/bundle

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: yukinal-${{ matrix.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: target/release/bundle/
          if-no-files-found: error
          retention-days: 30
