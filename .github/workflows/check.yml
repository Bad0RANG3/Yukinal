name: check

# One job per OS that runs the local gate (`pnpm check`), including the configured
# CTest suite for the C++ SSH service and Python Agent.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    name: pnpm check (${{ matrix.os }})
    # The release-candidate workflow runs the full gate before building platform
    # installers, so the tag-triggered check workflow only repeats the advisory audit.
    if: github.event_name != 'push' || github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            openssh_container_test: ON
          - os: windows-latest
            openssh_container_test: OFF
          - os: macos-latest
            openssh_container_test: OFF
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      YUKINAL_SSH_CMAKE_BUILD_DIR: native/build-check
    steps:
      # The gate runs package install scripts; do not persist checkout credentials in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
          # The gate installs both Python projects; the key must cover both manifests.
          cache-dependency-path: |
            agent/pyproject.toml
            services/control-plane/pyproject.toml

      - name: Install Linux system deps (WebKitGTK for the C++ desktop host)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libsecret-1-dev build-essential curl wget file libssl-dev

      - name: Install Python Agent and SSH test dependencies
        run: python -m pip install -e "agent[agent,models,test]"

      # The gate runs the control-plane suite unconditionally; without these deps the
      # step would either skip silently (the old behaviour) or fail on a clean runner.
      # The `test` extra is enough: CI only exercises the SQLite path, so `postgres` stays out.
      - name: Install control-plane test dependencies
        run: python -m pip install -e "services/control-plane[test]"

      - name: Add NMake to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) { throw 'Visual Studio C++ tools were not found.' }
          $nmake = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Tools\MSVC') -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\nmake.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $nmake) { throw 'NMake was not found in the selected Visual Studio installation.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $nmake)

      - name: Configure C++ SSH service, desktop host, and tests
        run: cmake -S native -B native/build-check -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYUKINAL_FETCH_DEPS=ON -DYUKINAL_BUILD_TESTS=ON -DYUKINAL_ENABLE_SSH_CONTAINER_TEST=${{ matrix.openssh_container_test }}

      - name: Build C++ targets
        if: matrix.os != 'windows-latest'
        run: cmake --build native/build-check --config Release --parallel

      - name: Build C++ targets (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLDIR=%%i"
          call "%VSINSTALLDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build native/build-check --config Release

      # check.mjs runs CTest against this build, then the JavaScript/contract gates.
      - run: pnpm install --frozen-lockfile
      # YUKINAL_CONTROL_PLANE_REQUIRED turns "the control-plane interpreter vanished"
      # into a red gate on CI instead of a silent skip.
      - run: pnpm check
        env:
          YUKINAL_CONTROL_PLANE_REQUIRED: "1"

  advisory:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The job runs package install scripts; do not persist checkout credentials in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep network-backed package audits out of the deterministic local/OS gate.
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit
