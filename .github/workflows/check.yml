name: check

# One job per OS that runs exactly the local gate (`pnpm check`): contract libs ->
# typecheck -> agent bundle -> TS tests -> vite build -> sidecar smoke -> cargo
# fmt/clippy/check -> Rust<->Node integration. Keeping CI and local identical is the
# point; a separate "rust" job would drift (and `cargo check` needs apps/desktop/dist).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  gate:
    name: pnpm check (${{ matrix.os }} / Rust ${{ matrix.rust }})
    # Release package.yml runs this full matrix for tags; keep the tag-triggered
    # check workflow focused on dependency advisory audits.
    if: github.event_name != 'push' || github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the full Linux/GTK dependency graph honest at the declared MSRV.
          - os: ubuntu-latest
            rust: 1.90.0
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned action
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Linux system deps (Tauri / webkit2gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # check.mjs passes its own node executable + the built agent entry to
      # `cargo test`, so the cross-language test opts itself in here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  advisory:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The job runs package install scripts; do not persist checkout credentials in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep network-backed package audits out of the deterministic local/OS gate.
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: pnpm audit

      - name: Install pinned cargo-audit CLI
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit
