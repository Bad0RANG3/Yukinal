name: check

# One job per OS that runs exactly the local gate (`pnpm check`): contract libs ->
# typecheck -> agent bundle -> TS tests -> vite build -> sidecar smoke -> cargo
# fmt/clippy/check -> Rust<->Node integration. Keeping CI and local identical is the
# point; a separate "rust" job would drift (and `cargo check` needs apps/desktop/dist).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version:` here: package.json already pins `packageManager: pnpm@11.8.0`,
      # and action-setup v4 fails when both are present.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps (Tauri / webkit2gtk)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      # check.mjs passes its own node executable + the built agent entry to
      # `cargo test`, so the cross-language test opts itself in here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  advisory:
    name: rust advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
