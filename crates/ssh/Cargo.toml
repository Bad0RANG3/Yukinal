[package]
name = "yukinal-ssh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
russh = { workspace = true }
russh-sftp = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
ssh-key = { workspace = true }
signature = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
yukinal-net = { workspace = true }

# New deps rationale (repo rule): russh/russh-sftp — MIT, maintained, pure Rust,
# cross-platform, replaces hand-rolled SSH. tokio-util — MIT, part of the tokio
# team, cancels in-flight tool calls without killing the runtime. tracing — MIT.

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
# Key-material generation for the auth tests (matching known_hosts tests, which build
# their fixtures on the fly instead of committing key files).
rand = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
