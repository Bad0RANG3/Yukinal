[package]
name = "yukinal-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
legacy-rust-ssh-tests = ["dep:yukinal-ssh", "dep:yukinal-terminal"]

[dependencies]
serde = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
yukinal-database = { workspace = true }
yukinal-net = { workspace = true }
yukinal-ssh = { workspace = true, optional = true }
yukinal-terminal = { workspace = true, optional = true }
yukinal-time = { workspace = true }

tracing = { workspace = true }

tokio-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
