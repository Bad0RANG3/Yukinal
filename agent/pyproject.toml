[project]
name = "yukinal-agent-node"
version = "0.1.0"
description = "Python Agent Runtime and caller for the local Yukinal SSH service."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
yukinal-agent-node = "yukinal_agent.sidecar:main"

[project.optional-dependencies]
test = ["paramiko>=3.5,<6"]
agent = ["jsonschema>=4.22,<5", "langgraph>=1.2,<2", "mcp>=2,<3"]
models = ["langchain-anthropic>=1.7,<2", "langchain-openai>=1.6,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukinal_ssh", "src/yukinal_agent"]
