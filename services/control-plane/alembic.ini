# Alembic configuration for the Yukinal control plane.
#
# The database URL is not set here: migrations/env.py derives it from
# YUKINAL_CONTROL_DATABASE_URL so a deployed control plane has exactly one
# source of truth for its connection string.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
