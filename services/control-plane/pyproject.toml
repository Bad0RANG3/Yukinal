[project]
name = "yukinal-control-plane"
version = "0.1.0"
description = "Yukinal control plane: FastAPI + PostgreSQL multi-tenant node/task/approval registry."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "pydantic-settings>=2.4,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
# Production driver. Tests and local development use the SQLite driver below.
postgres = ["asyncpg>=0.29,<1"]
test = ["httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[project.scripts]
yukinal-control-plane = "yukinal_control_plane.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yukinal_control_plane"]
