packages:
  - "apps/*"
  - "packages/*"

# pnpm gates lifecycle/postinstall scripts. esbuild is the only workspace dependency
# that needs one, and its native binary is covered by the packaging checks.
allowBuilds:
  esbuild: true

# Vite 8 currently resolves this exact @types/node release through its optional peer.
minimumReleaseAgeExclude:
  - '@types/node@26.4.1'
