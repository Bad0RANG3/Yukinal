packages:
  - "apps/*"
  - "packages/*"

# pnpm gates lifecycle/postinstall scripts. esbuild is the only workspace dependency
# that needs one, and its native binary is covered by the packaging checks.
allowBuilds:
  esbuild: true

# Vite 8 currently resolves this exact @types/node release through its optional peer.
minimumReleaseAgeExclude:
  - '@types/node@26.4.1'

overrides:
  source-map-js: 1.2.2
  # No published fix for GHSA-fc5q-39xc-vjpf yet. This is the original 4.0.7
  # runtime plus the reviewed security backport; see vendor/picomatch/PATCHES.md.
  picomatch: file:vendor/picomatch
